<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #24292e;
      background: #ffffff;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    header.top {
      border-bottom: 1px solid #e1e4e8;
      padding: 1rem 2rem;
    }
    header.top a {
      color: #0366d6;
      text-decoration: none;
      font-weight: 600;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 2.5rem 4rem;
    }
    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      margin-top: 1.8em;
      margin-bottom: 0.6em;
    }
    h1 { font-size: 2.2rem; }
    h2 { font-size: 1.6rem; }
    h3 { font-size: 1.3rem; }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    pre {
      background: #f6f8fa;
      padding: 1rem;
      overflow-x: auto;
      border-radius: 6px;
    }
    code {
      background: #f6f8fa;
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.95em;
    }
    pre code {
      background: none;
      padding: 0;
    }
    a { color: #0366d6; }
    hr { border: none; border-top: 1px solid #e1e4e8; margin: 2rem 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #e1e4e8; padding: 0.5rem 0.8rem; text-align: left; }
  </style>
</head>
<body>
  <header class="top">
    <a href="{{ '/' | relative_url }}">← Alle Berichte</a>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
