<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #24292e;
      background: #ffffff;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    header.top {
      border-bottom: 1px solid #e1e4e8;
      padding: 1rem 2rem;
    }
    header.top a {
      color: #0366d6;
      text-decoration: none;
      font-weight: 600;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 2.5rem 4rem;
    }
    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      margin-top: 1.8em;
      margin-bottom: 0.6em;
    }
    h1 { font-size: 2.2rem; }
    h2 { font-size: 1.6rem; }
    h3 { font-size: 1.3rem; }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    pre {
      background: #f6f8fa;
      padding: 1rem;
      overflow-x: auto;
      border-radius: 6px;
    }
    code {
      background: #f6f8fa;
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.95em;
    }
    pre code {
      background: none;
      padding: 0;
    }
    a { color: #0366d6; }
    hr { border: none; border-top: 1px solid #e1e4e8; margin: 2rem 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #e1e4e8; padding: 0.5rem 0.8rem; text-align: left; }

    /* Syntax-Highlighting (Rouge) */
    .highlight { background: #f6f8fa; }
    .highlight .c, .highlight .c1, .highlight .cm { color: #6a737d; font-style: italic; } /* Kommentare */
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kp, .highlight .kr { color: #d73a49; } /* Keywords */
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb { color: #032f62; } /* Strings */
    .highlight .n, .highlight .nv, .highlight .nb { color: #24292e; } /* Namen/Variablen */
    .highlight .nf, .highlight .nx { color: #6f42c1; } /* Funktionen */
    .highlight .o, .highlight .ow { color: #d73a49; } /* Operatoren */
    .highlight .m, .highlight .mi, .highlight .mf { color: #005cc5; } /* Zahlen */
    .highlight .p { color: #24292e; } /* Interpunktion */
    .highlight .gp { color: #6a737d; } /* Prompt-Zeichen z.B. $ */
    .highlight .err { color: #24292e; background: none; }
  </style>
</head>
<body>
  <header class="top">
    <a href="{{ '/' | relative_url }}">← Alle Berichte</a>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
